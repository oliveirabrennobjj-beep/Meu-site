<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BN Digital — placas de mesa</title>
<style>
  @font-face { font-family: "PF"; src: url("assets/fonts/playfair-display-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
  @font-face { font-family: "PF"; src: url("assets/fonts/playfair-display-latin-wght-italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: "IN"; src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "MO"; src: url("assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  :root { --blue: #0a66e8; --blue-l: #4da3ff; --ink: #0a0f1c; --soft: #5a6172; --soft-d: #9fb0cc; --wa: #25d366; --warm: #ffb347; --orange: #d9661f; --cream: #e9d6bd; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "IN", sans-serif; -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .abs { position: absolute; }
  .serif { font-family: "PF", serif; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; }
  .it { font-style: italic; }
  .cx { left: 0; right: 0; text-align: center; }
  .word { display: inline-block; }
  .navy-bg { background: radial-gradient(120% 70% at 50% 0%, #0d2a66 0%, #071635 45%, #030a1c 100%); }
  .grid-bg { background-color: #f3f5fa;
    background-image: radial-gradient(70% 45% at 50% 42%, rgba(255,255,255,.95), rgba(255,255,255,0)),
      linear-gradient(rgba(12,40,100,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(12,40,100,.07) 2px, transparent 2px);
    background-size: 100% 100%, 72px 72px, 72px 72px; background-position: 0 0, -2px -2px, -2px -2px; }
  .eyebrow { font-size: 28px; font-weight: 700; letter-spacing: .22em; }
  .chip { display: inline-flex; align-items: center; gap: 14px; padding: 16px 28px; border-radius: 999px; font-size: 32px; font-weight: 600; white-space: nowrap; }
  .phone { position: absolute; border-radius: 58px; background: #16181d; padding: 13px; box-sizing: border-box; transform-origin: 0 0;
           box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset, 0 2px 0 3px #2a2d35, 0 60px 100px -30px rgba(0,0,0,.8); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: #000; }
  .notch { position: absolute; left: 50%; top: 13px; width: 32%; height: 28px; transform: translateX(-50%); border-radius: 20px; background: #000; z-index: 9; }
  .tap { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(255,255,255,.45); border: 4px solid #fff; box-shadow: 0 6px 20px rgba(0,0,0,.35); opacity: 0; z-index: 20; }
  .plate { position: absolute; border-radius: 30px; background: linear-gradient(160deg,#23272f 0%,#101318 55%,#07080b 100%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.13), 0 30px 60px -20px rgba(0,0,0,.85); overflow: hidden; color: #fff; text-align: center; }
  .plate .gloss { position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,0) 38%); pointer-events: none; }
  .logo-b { border-radius: 50%; background: radial-gradient(circle at 35% 30%,#ffb347,#d9661f 70%); display: grid; place-items: center; font-family: "PF", serif; font-weight: 800; color: #fff; font-style: normal; }
  .mn-row { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid #f0e2d2; }
  .mn-row img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; flex: none; }
  .cell { position: absolute; width: 470px; height: 290px; border-radius: 30px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); box-sizing: border-box; padding: 30px; display: flex; gap: 26px; align-items: center; }
  .mini { width: 130px; height: 190px; flex: none; border-radius: 18px; background: linear-gradient(160deg,#2a2f39,#0b0d12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 14px 30px -10px rgba(0,0,0,.7); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .mini i { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; }
  .card { position: absolute; border-radius: 34px; background: #fff; box-shadow: 0 30px 60px -24px rgba(10,30,80,.35), 0 0 0 1px rgba(10,30,80,.06); }
</style>
</head>

<script src="textos.js"></script>
<script>
const C = window.TEXTOS;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x, c = 1.5) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const inOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
function rich(s, color = "var(--blue-l)") {
  return s.split("|").join("<br>").replace(/\*([^*]+)\*/g, `<span class="it" style="color:${color}">$1</span>`);
}
function words(el, s, color = "var(--blue-l)") {
  let html = "", inHi = false;
  s.split("|").forEach((line, li) => {
    if (li) html += "<br>";
    line.trim().split(" ").forEach((w, wi) => {
      if (w.startsWith("*")) inHi = true;
      const end = w.endsWith("*"), clean = w.replace(/\*/g, "");
      html += (wi ? " " : "") + `<span class="word${inHi ? " it" : ""}"${inHi ? ` style="color:${color}"` : ""}>${clean}</span>`;
      if (end) inHi = false;
    });
  });
  el.innerHTML = html;
  return [...el.querySelectorAll(".word")];
}
function enter(el, t, at, dur = 0.5, dy = 50, ease = outCubic) {
  const p = ease(prog(t, at, at + dur));
  el.style.opacity = clamp(prog(t, at, at + dur * 0.7));
  el.style.transform = `translateY(${(1 - p) * dy}px)`;
}
