<style>

           box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset, 0 2px 0 3px #2a2d35, 0 60px 100px -30px rgba(0,0,0,.8); }

  .logo-b { border-radius: 50%; background: radial-gradient(circle at 35% 30%,#ffb347,#d9661f 70%); display: grid; place-items: center; font-family: "PF", serif; font-weight: 800; color: #fff; font-style: normal; }
  .mn-row { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid #f0e2d2; }
  .mn-row img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; flex: none; }
  .card { position: absolute; border-radius: 34px; background: #fff; box-shadow: 0 30px 60px -24px rgba(10,30,80,.35), 0 0 0 1px rgba(10,30,80,.06); }
  .mini { width: 130px; height: 190px; flex: none; border-radius: 18px; background: linear-gradient(160deg,#2a2f39,#0b0d12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 14px 30px -10px rgba(0,0,0,.7); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }

<script>
const C = window.TEXTOS, TL = window.TL;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x, c = 1.5) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const inOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const V = (n, f) => TL[n].v + TL[n].d * f;   // momento em que a voz da cena n está na fração f
function rich(s, color = "var(--blue-l)") { return s.split("|").join("<br>").replace(/\*([^*]+)\*/g, `<span class="it" style="color:${color}">$1</span>`); }
function words(el, s, color = "var(--blue-l)") {
  let html = "", inHi = false;
  s.split("|").forEach((line, li) => { if (li) html += "<br>";
    line.trim().split(" ").forEach((w, wi) => { if (w.startsWith("*")) inHi = true; const end = w.endsWith("*"), clean = w.replace(/\*/g, "");
      html += (wi ? " " : "") + `<span class="word${inHi ? " it" : ""}"${inHi ? ` style="color:${color}"` : ""}>${clean}</span>`; if (end) inHi = false; }); });
  el.innerHTML = html; return [...el.querySelectorAll(".word")];
}
function enter(el, t, at, dur = 0.5, dy = 50) { const p = outCubic(prog(t, at, at + dur)); el.style.opacity = clamp(prog(t, at, at + dur * 0.7)); el.style.transform = `translateY(${(1 - p) * dy}px)`; }
function wordsIn(ws, t, at, step = 0.08, dur = 0.45, dy = 50) { ws.forEach((w, i) => enter(w, t, at + i * step, dur, dy)); }
function pop(el, t, at, dur = 0.45, from = 0.7) { const p = prog(t, at, at + dur); el.style.opacity = clamp(p * 2); el.style.transform = `scale(${lerp(from, 1, outBack(p, 2))})`; }
function tapAt(el, t, x, y, at) {
  el.style.left = x + "px"; el.style.top = y + "px";
  const a = prog(t, at - 0.25, at - 0.05), press = prog(t, at, at + 0.15), gone = prog(t, at + 0.25, at + 0.45);
  el.style.opacity = clamp(a) * (1 - gone); el.style.transform = `scale(${lerp(1.25, 1, a) - 0.18 * Math.sin(Math.PI * press)})`;
}
function reveal(el, t, a, d, kind, x = 540, y = 960) {
  const p = inOut(prog(t, a, a + d)); el.style.opacity = 1;
  if (p >= 1 || kind === "none") { el.style.clipPath = "none"; return; }
  if (kind === "circle") el.style.clipPath = `circle(${p * 2300}px at ${x}px ${y}px)`;
  if (kind === "up") el.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0)`;
  if (kind === "left") el.style.clipPath = `inset(0 0 0 ${(1 - p) * 100}%)`;
}
function show(el, t, a, b) { const on = t >= a && t < b; el.style.visibility = on ? "visible" : "hidden"; return on; }
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function center(el, box) { const a = el.getBoundingClientRect(), b = box.getBoundingClientRect(); return [a.left - b.left + a.width / 2, a.top - b.top + a.height / 2]; }
function ringsIn(box, n, size, left, top, color) { for (let i = 0; i < n; i++) { const r = document.createElement("div"); r.className = "abs";
  r.style.cssText = `left:${left}px; top:${top}px; width:${size}px; height:${size}px; border-radius:50%; border:6px solid ${color}; opacity:0`; box.appendChild(r); } return [...box.children]; }
function pulse(rs, t, at, every = 0.22, dur = 0.9, grow = 2.4) { rs.forEach((r, i) => { const c = prog(t, at + i * every, at + i * every + dur);
  r.style.opacity = c > 0 && c < 1 ? (1 - c) * 0.95 : 0; r.style.transform = `scale(${0.6 + c * grow})`; }); }
function el(tag, cls, css, html, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function scene(id, cls, style = "") { const e = el("section", "scene " + cls, style, "", $("stage")); e.id = id; return e; }
function bokeh(parent, seed, n = 18) { const r = rng(seed), out = []; for (let i = 0; i < n; i++) { const sz = 40 + r() * 140, warm = r() > 0.3;
  const d = el("i", "abs", `width:${sz}px; height:${sz}px; border-radius:50%; background:${warm ? "#ffb35c" : "#ffe3b0"}; filter:blur(${8 + r() * 16}px)`, "", parent);
  out.push({ el: d, x: r() * 1080 - sz / 2, y: 60 + r() * 1000, o: 0.06 + r() * 0.26, ph: r() * 6.28 }); } return out; }
function bokehAnim(list, t) { list.forEach((b) => { b.el.style.transform = `translate(${b.x + Math.sin(t * 0.35 + b.ph) * 18}px, ${b.y + Math.cos(t * 0.3 + b.ph) * 12}px)`; b.el.style.opacity = b.o * (0.75 + 0.25 * Math.sin(t * 0.9 + b.ph)); }); }

// ícones (traço branco, viewBox 24)
const ICON = {
  "Cardápio": [`#f08a24`, `<path d="M4 3h12a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2zM8 8h6M8 12h6M8 16h3"/>`],
  "Wi-Fi": [`#0a66e8`, `<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19.2" r="1" fill="#fff"/>`],
  "Pix": [`#32bcad`, `<path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/><path d="M8.5 12h7"/>`],
  "Instagram": [`linear-gradient(45deg,#f58529,#dd2a7b 55%,#8134af)`, `<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="#fff"/>`],
  "WhatsApp": [`#25d366`, `<use href="#wa" fill="#fff" stroke="none"/>`],
  "Google": [`#f5a300`, `<path d="M12 3.2l2.6 5.5 6 .7-4.4 4.1 1.2 6-5.4-3-5.4 3 1.2-6-4.4-4.1 6-.7z" fill="#fff"/>`],
  "Localização": [`#e8453c`, `<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/>`],
  "Site": [`#0a2a66`, `<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>`],
  "TikTok": [`#111111`, `<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.7 2.4 4.4 5 4.6"/>`],
  "Facebook": [`#1877f2`, `<path d="M14.5 21v-7.5H17l.5-3h-3V8.6c0-.9.3-1.6 1.6-1.6h1.6V4.3c-.3 0-1.3-.1-2.4-.1-2.4 0-3.9 1.4-3.9 4.1v2.2H8.6v3H11V21"/>`],
  "Contato": [`#7c3aed`, `<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="11" r="2.4"/><path d="M5.5 16.5c.7-1.6 2-2.5 3.5-2.5s2.8.9 3.5 2.5M14.5 9.5h4M14.5 13h4"/>`],
  "Qualquer link": [`#0f766e`, `<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>`],
};
const NFC_SVG = (sz, col = "#fff") => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M10.5 18h3"/><path d="M19.5 8.5a6 6 0 0 1 0 7M21.8 6.5a9 9 0 0 1 0 11M4.5 8.5a6 6 0 0 0 0 7M2.2 6.5a9 9 0 0 0 0 11"/></svg>`;
const ico = (name, sz, sw = 2) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICON[name][1]}</svg>`;
function qrHTML(seed, sz) { const r = rng(seed); let h = ""; for (let i = 0; i < 121; i++) { const x = i % 11, y = Math.floor(i / 11);
    const inF = (fx, fy) => x >= fx && x < fx + 3 && y >= fy && y < fy + 3; const finder = inF(0, 0) || inF(8, 0) || inF(0, 8);
    const on = finder ? !((x === 1 || x === 9) && (y === 1 || y === 9)) : r() > 0.5; h += `<i style="background:${on ? "#0b0d12" : "transparent"}"></i>`; }
  return `<div style="width:${sz}px; height:${sz}px; background:#fff; border-radius:10px; padding:${sz * 0.075}px; box-sizing:border-box; display:grid; grid-template-columns:repeat(11,1fr)">${h}</div>`; }
// placa de acrílico de uma função (Wi-Fi, Pix...)
function plateHTML(kind, label) { const [bg] = ICON[kind];
  return `<div class="plate" style="left:0; top:0; width:340px; height:500px; background:linear-gradient(160deg,#23272f 0%,#101318 55%,#07080b 100%); color:#fff">
    <div class="gloss"></div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:30px"><i class="logo-b" style="width:46px; height:46px; font-size:26px">B</i><b class="serif" style="font-size:30px">${C.restaurante}</b></div>
    <div style="width:150px; height:150px; border-radius:50%; background:${bg}; margin:34px auto 0; display:grid; place-items:center; box-shadow:0 0 0 8px rgba(255,255,255,.08)">${ico(kind, 84, 1.8)}</div>
    <div style="font-size:44px; font-weight:800; margin-top:24px">${label}</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; color:rgba(255,255,255,.75); font-size:21px; font-weight:600">${NFC_SVG(40, "rgba(255,255,255,.8)")}Aproxime o celular</div>
  </div>`; }

// =================== MONTAGEM ===================
const R = {};  // referências por cena

// ---------- 1-3. restaurante: cardápio de papel, placa de mesa, cardápio no celular ----------
{ const s = scene("rest", "resto"); R.rest = s;
  const bk = el("div", "", "", "", s); R.bk1 = bokeh(bk, 5, 22);
  el("div", "table", "", `<div class="abs" style="left:80px; top:10px; width:920px; height:320px; background:radial-gradient(closest-side, rgba(255,220,170,.22), transparent)"></div>`, s);
  const cam = el("div", "abs", "inset:0; transform-origin:540px 1100px", "", s); R.cam = cam;
  const p1 = el("div", "abs", "inset:0; perspective:1400px", "", cam);
  R.pm = el("div", "abs", "left:270px; top:620px; width:540px; height:700px; transform-origin:50% 100%", `
    <div class="abs" style="inset:0; border-radius:10px; background:#efe2c8; background-image:repeating-linear-gradient(0deg, rgba(120,80,40,.05) 0 2px, transparent 2px 6px); box-shadow:inset 0 0 0 12px #e2cfaa, inset 0 0 0 14px #c9ad7d, 0 40px 60px -20px rgba(0,0,0,.8); padding:56px 54px; box-sizing:border-box; color:#5a3a1c; font-family:'PF',serif">
      <div style="text-align:center; font-size:60px; font-weight:800; letter-spacing:.06em">CARDÁPIO</div><div style="height:3px; background:#c9ad7d; margin:18px 60px 30px"></div>
      ${C.cardapioPapel.map(([n, p]) => `<div style="display:flex; align-items:baseline; gap:10px; font-size:34px; margin-bottom:22px"><span>${n}</span><span style="flex:1; border-bottom:3px dotted #b89a6a; transform:translateY(-8px)"></span><span style="font-family:'MO',monospace; font-size:28px">${p}</span></div>`).join("")}
      <div class="abs" style="right:70px; bottom:90px; width:130px; height:130px; border-radius:50%; box-shadow:inset 0 0 0 9px rgba(140,90,40,.18), inset 0 0 0 14px rgba(140,90,40,.06)"></div></div>`, p1);
  const p2 = el("div", "abs", "inset:0; perspective:1600px", "", cam);
  R.pl = el("div", "abs", "left:330px; top:600px; width:420px; height:690px; transform-origin:50% 100%", `
    <div class="abs" style="left:70px; top:600px; width:280px; height:56px; background:linear-gradient(180deg,#22262f,#0b0d12); clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)"></div>
    <div class="abs" style="left:20px; top:640px; width:380px; height:46px; border-radius:50%; background:rgba(0,0,0,.6); filter:blur(14px)"></div>
    <div class="plate" style="left:0; top:0; width:420px; height:608px; background:linear-gradient(160deg,#23272f 0%,#101318 55%,#07080b 100%); color:#fff">
      <div class="gloss"></div><div class="logo-b" style="width:100px; height:100px; font-size:54px; margin:38px auto 0">B</div>
      <div class="serif" style="font-size:44px; margin-top:12px">${C.restaurante}</div>
      <div style="position:relative; width:120px; height:120px; margin:26px auto 0">${NFC_SVG(120)}<div id="rings1"></div></div>
      <div style="font-size:26px; font-weight:600; color:rgba(255,255,255,.82); margin-top:10px">${C.aproxime}</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:32px; margin-top:36px">${qrHTML(7, 122)}
        <div style="text-align:left"><div style="font-size:24px; letter-spacing:.3em; color:rgba(255,255,255,.6); font-weight:700">MESA</div><div style="font-size:100px; font-weight:800; line-height:1">${C.mesa}</div></div></div>
    </div>`, p2);
  R.rings1 = ringsIn($("rings1"), 3, 110, 5, 5, "#4da3ff");
  R.h1 = el("div", "abs cx serif", "top:200px; font-size:92px; color:#fff; padding:0 40px", "", s); R.h1w = words(R.h1, C.gancho);
  R.e2 = el("div", "abs cx", "top:165px", `<span class="eyebrow" style="color:var(--blue-l)">${C.placaSobretitulo}</span>`, s);
  R.h2 = el("div", "abs cx serif", "top:220px; font-size:96px; color:#fff; padding:0 40px", "", s); R.h2w = words(R.h2, C.placaTitulo);

  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  window.render(0);
  return true;
})();
</script>
