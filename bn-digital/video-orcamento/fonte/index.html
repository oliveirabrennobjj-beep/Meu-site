<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BN Digital — vídeo do orçamento</title>
<style>
  @font-face { font-family: "PF"; src: url("assets/fonts/playfair-display-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
  @font-face { font-family: "PF"; src: url("assets/fonts/playfair-display-latin-wght-italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: "IN"; src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "MO"; src: url("assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  :root { --blue: #0a66e8; --blue-l: #4da3ff; --ink: #0a0f1c; --soft: #5a6172; --soft-d: #9fb0cc; --wa: #25d366; --paper: #fbfaf6; --navy: #050d22; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "IN", sans-serif; -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .abs { position: absolute; }
  .serif { font-family: "PF", serif; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; }
  .it { font-style: italic; }
  .cx { left: 0; right: 0; text-align: center; }
  .word { display: inline-block; }
  .navy-bg { background: radial-gradient(120% 70% at 50% 0%, #0d2a66 0%, #071635 45%, #030a1c 100%); }
  .grid-bg { background-color: #f3f5fa;
    background-image: radial-gradient(70% 45% at 50% 42%, rgba(255,255,255,.95), rgba(255,255,255,0)),
      linear-gradient(rgba(12,40,100,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(12,40,100,.07) 2px, transparent 2px);
    background-size: 100% 100%, 72px 72px, 72px 72px; background-position: 0 0, -2px -2px, -2px -2px; }
  .eyebrow { font-size: 28px; font-weight: 700; letter-spacing: .18em; color: var(--blue); }
  .chip { display: inline-flex; align-items: center; gap: 14px; padding: 16px 28px; border-radius: 999px; font-size: 32px; font-weight: 600; white-space: nowrap; }

  /* impressora */
  .printer { position: absolute; width: 680px; height: 420px; transform-origin: 0 0; }
  .pr-shadow { position: absolute; left: -70px; top: 380px; width: 820px; height: 90px; border-radius: 50%; background: rgba(0,0,0,.75); filter: blur(28px); }
  .pr-top { position: absolute; left: 0; top: 50px; width: 680px; height: 100px; clip-path: polygon(50px 0, 630px 0, 680px 100px, 0 100px);
            background: linear-gradient(180deg, #3a4560 0%, #252e44 55%, #1b2234 100%); }
  .pr-top::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 120% at 50% 0%, rgba(160,200,255,.22), transparent 70%); }
  .pr-front { position: absolute; left: 0; top: 150px; width: 680px; height: 250px; border-radius: 0 0 46px 46px;
              background: linear-gradient(180deg, #1a2030 0%, #10141f 60%, #0a0d15 100%);
              box-shadow: inset 0 2px 0 rgba(255,255,255,.14), inset 18px 0 30px -20px rgba(255,255,255,.08), inset -18px 0 30px -20px rgba(0,0,0,.6); }
  .pr-brand { position: absolute; left: 0; right: 0; top: 108px; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .42em; color: rgba(255,255,255,.32); }
  .pr-led { position: absolute; left: 590px; top: 72px; width: 18px; height: 18px; border-radius: 50%; background: #4da3ff; }
  .pr-btn { position: absolute; left: 70px; top: 64px; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(180deg, #2b3348, #151a26); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 2px 4px rgba(0,0,0,.5); }
  .pr-grille { position: absolute; left: 230px; right: 230px; top: 170px; height: 34px; background: repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 6px, transparent 6px 14px); border-radius: 6px; opacity: .7; }
  .pr-slot { position: absolute; left: 130px; top: 88px; width: 420px; height: 14px; border-radius: 7px; background: linear-gradient(180deg, #000 0%, #05070c 70%, #1d2437 100%); }
  .pr-tear { position: absolute; left: 118px; top: 102px; width: 444px; height: 12px; border-radius: 2px;
             background: linear-gradient(180deg, #e6ebf2, #8a93a3 60%, #4b5263);
             -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 12px 100%;
             mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 12px 100%; }
  .pr-paper { position: absolute; left: 140px; bottom: 325px; width: 400px; height: 0; overflow: hidden; transform-origin: 50% 100%;
              background: var(--paper); }
  .pr-paper .shade { position: absolute; inset: 0; pointer-events: none;
              background: linear-gradient(0deg, rgba(0,0,0,.28) 0px, rgba(0,0,0,0) 70px), linear-gradient(90deg, rgba(0,0,0,.06), transparent 12%, transparent 88%, rgba(0,0,0,.08)); }
  .pr-paper .gleam { position: absolute; left: -60%; top: 0; bottom: 0; width: 26%; opacity: 0; background: linear-gradient(100deg, transparent, rgba(255,255,255,.85), transparent); }

  /* cupom */
  .rc { position: absolute; left: 0; top: 0; width: 400px; box-sizing: border-box; padding: 34px 26px 0; color: #1b1c20; font-family: "MO", monospace; text-align: center; }
  .rc-logo { width: 84px; height: 84px; border-radius: 50%; display: block; margin: 0 auto 12px; filter: grayscale(1) contrast(1.15); }
  .rc-brand { font-size: 32px; font-weight: 800; letter-spacing: .12em; }
  .rc-s { font-size: 18px; line-height: 26px; color: #3a3b40; }
  .rc-div { border-top: 2px dashed #a9a9ae; margin: 14px 0; }
  .rc-row { display: flex; justify-content: space-between; font-size: 22px; font-weight: 800; }
  .rc-item { font-size: 24px; font-weight: 800; line-height: 30px; text-align: left; }
  .rc-s2 { font-size: 19px; line-height: 28px; text-align: left; color: #3a3b40; }
  .rc-c { text-align: center; }
  .rc-price { font-size: 76px; font-weight: 800; letter-spacing: -0.04em; line-height: 90px; }
  .rc-price small { font-size: 28px; letter-spacing: 0; margin-left: 4px; }

  /* lista impressa */
  .ls { position: absolute; left: 0; top: 0; width: 400px; color: #16171b; }
  .ls-head { height: 80px; box-sizing: border-box; padding-top: 16px; text-align: center; font-family: "MO", monospace; border-bottom: 2px dashed #a9a9ae; margin: 0 22px; }
  .ls-head b { display: block; font-size: 22px; letter-spacing: .14em; }
  .ls-head span { display: block; font-size: 14px; letter-spacing: .2em; color: #4a4b52; margin-top: 4px; }
  .ls-row { height: 78px; display: flex; align-items: center; gap: 12px; margin: 0 22px; border-bottom: 1px solid #e4e3dd; }
  .ls-row p { flex: 1; margin: 0; font-size: 21px; line-height: 26px; font-weight: 650; }
  .ls-ck { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; transform: scale(0); }

  /* celular e navegador */
  .phone { position: absolute; border-radius: 64px; background: #16181d; padding: 14px; box-sizing: border-box;
           box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset, 0 2px 0 3px #2a2d35; transform-origin: 0 0; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #000; }
  .screen img { position: absolute; left: 0; top: 0; width: 100%; }
  .notch { position: absolute; left: 50%; top: 14px; width: 32%; height: 32px; transform: translateX(-50%); border-radius: 20px; background: #000; z-index: 5; }
  .browser { position: absolute; border-radius: 22px; overflow: hidden; background: #fff;
             box-shadow: 0 50px 100px -30px rgba(10,30,80,.45), 0 0 0 1px rgba(10,30,80,.1); }
  .b-bar { position: absolute; left: 0; right: 0; top: 0; height: 56px; background: #eceff4; display: flex; align-items: center; gap: 12px; padding: 0 20px; box-sizing: border-box; }
  .b-dot { width: 16px; height: 16px; border-radius: 50%; }
  .b-tab { margin-left: 22px; height: 40px; align-self: flex-end; background: #fff; border-radius: 12px 12px 0 0; padding: 0 22px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: #333; min-width: 230px; }
  .b-url { flex: 1; height: 34px; margin-left: 12px; border-radius: 17px; background: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 18px; color: #7a8090; gap: 8px; }
  .b-view { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; overflow: hidden; background: #fff; }
  .b-view img { position: absolute; left: 0; top: 0; width: 100%; }

  .tap { position: absolute; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(255,255,255,.45); border: 4px solid #fff; box-shadow: 0 6px 20px rgba(0,0,0,.35); opacity: 0; z-index: 40; }
  .card { position: absolute; border-radius: 34px; background: #fff; box-shadow: 0 30px 60px -24px rgba(10,30,80,.35), 0 0 0 1px rgba(10,30,80,.06); }
  .zig { -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 22px 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 22px 51% repeat-x;
         mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 22px 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 22px 51% repeat-x; }
  .zig-b { -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%;
           mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%; }
  .skel { height: 18px; border-radius: 9px; background: #e7eaf0; }
  .pill { display: inline-flex; align-items: center; gap: 18px; padding: 14px 32px 14px 14px; border-radius: 999px; background: #fff; font-size: 38px; font-weight: 700; color: var(--ink); white-space: nowrap;
          box-shadow: 0 16px 34px -16px rgba(10,30,80,.35), 0 0 0 1px rgba(10,30,80,.06); }
  .pill i { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .mn-row { display: flex; align-items: center; gap: 14px; padding: 18px 4px; border-bottom: 1px solid #f0e2d2; }
</style>
</head>
<body>
<div id="stage">

  <!-- 1. IMPRESSORA IMPRIMINDO O ORÇAMENTO -->
  <section class="scene navy-bg" id="s1">
    <div class="abs" id="s1-cam" style="inset:0; transform-origin:540px 1230px">
      <div class="abs" style="left:-100px; right:-100px; top:-200px; height:1700px; background:radial-gradient(45% 55% at 50% 30%, rgba(77,163,255,.20), transparent 70%)"></div>
      <div class="abs" style="left:90px; top:1000px; width:900px; height:600px; background:radial-gradient(closest-side, rgba(255,255,255,.09), transparent)"></div>
      <div class="abs" style="left:0; right:0; top:1760px; height:160px; background:linear-gradient(180deg, rgba(77,163,255,.06), transparent)"></div>
      <div id="s1-dust"></div>
      <div class="abs cx serif" id="s1-h" style="top:230px; font-size:96px; color:#fff; padding:0 60px"></div>
      <div id="s1-pr-host"></div>
    </div>
  </section>

  <!-- 2 + 3. CELULAR E SITES (mesmo fundo quadriculado) -->
  <section class="scene grid-bg" id="s23">
    <div class="abs cx serif" id="s2-h" style="top:190px; font-size:92px; color:var(--ink); padding:0 60px"></div>
    <div class="abs cx" id="s3-eyebrow" style="top:170px"><span class="eyebrow" id="s3-eyebrow-t"></span></div>
    <div class="abs cx serif" id="s3-h" style="top:225px; font-size:92px; color:var(--ink); padding:0 60px"></div>

    <svg class="abs" id="s2-svg" width="1080" height="1920" style="left:0; top:0; overflow:visible">
      <defs><mask id="s2-mask"><path id="s2-path-m" fill="none" stroke="#fff" stroke-width="12"/></mask></defs>
      <path id="s2-path" fill="none" stroke="#0a66e8" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round" mask="url(#s2-mask)"/>
      <circle id="s2-dot" r="13" fill="#0a66e8"/>
      <circle id="s2-dot2" r="24" fill="none" stroke="#0a66e8" stroke-width="3"/>
    </svg>
    <div class="abs zig-b" id="s2-rc" style="left:0; top:0; width:400px; height:660px; background:var(--paper); transform-origin:0 0; filter:drop-shadow(0 24px 30px rgba(10,30,80,.25))"></div>

    <!-- navegador -->
    <div class="browser" id="s3-browser" style="left:50px; top:520px; width:980px; height:700px; transform-origin:85% 90%">
      <div class="b-bar"><span class="b-dot" style="background:#ff5f57"></span><span class="b-dot" style="background:#febc2e"></span><span class="b-dot" style="background:#28c840"></span>
        <span class="b-tab"><i id="s3-fav" style="width:18px; height:18px; border-radius:50%; background:#0a66e8"></i><span id="s3-tab"></span></span>
        <span class="b-url"><svg width="16" height="16" viewBox="0 0 24 24" fill="#7a8090"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 1 0-8 0z"/></svg><span style="width:180px" class="skel"></span></span>
      </div>
      <div class="b-view" id="s3-view"></div>
    </div>
    <div class="abs" id="s2-shadow" style="left:480px; top:1650px; width:440px; height:60px; border-radius:50%; background:rgba(10,30,80,.35); filter:blur(22px)"></div>
    <div class="abs" id="s2-persp" style="inset:0; perspective:2200px; perspective-origin:690px 1100px">
      <div class="phone" id="ph" style="left:0; top:0; width:520px; height:1060px">
        <div class="screen" id="ph-screen"><div class="notch"></div></div>
      </div>
    </div>
    <div class="abs" id="s2-chip1" style="left:60px; top:1330px"><span class="chip" style="background:#fff; color:var(--ink); box-shadow:0 14px 30px -12px rgba(10,30,80,.3)"><i style="width:18px; height:18px; border-radius:50%; background:var(--wa)"></i><span id="s2-chip1-t"></span></span></div>
    <div class="abs" id="s2-chip2" style="left:60px; top:1440px"><span class="chip" style="background:#fff; color:var(--ink); box-shadow:0 14px 30px -12px rgba(10,30,80,.3)"><i style="width:18px; height:18px; border-radius:50%; background:var(--blue)"></i><span id="s2-chip2-t"></span></span></div>
    <div class="abs" style="left:70px; top:1290px; width:680px; height:200px" id="s3-caps"></div>
    <div class="abs" id="s3-resp" style="left:70px; top:1650px; font-size:38px; color:var(--soft); font-weight:500"></div>
  </section>

  <!-- 4. O QUE VEM NO SITE: LISTA IMPRESSA -->
  <section class="scene navy-bg" id="s4">
    <div class="abs" style="left:-100px; right:-100px; top:300px; height:1500px; background:radial-gradient(40% 50% at 50% 50%, rgba(77,163,255,.18), transparent 70%)"></div>
    <div class="abs cx serif" id="s4-h" style="top:170px; font-size:100px; color:#fff; padding:0 60px"></div>
    <div class="abs" id="s4-cam" style="inset:0; transform-origin:540px 1000px"><div id="s4-pr-host"></div></div>
  </section>

  <!-- 5. GOOGLE -->
  <section class="scene grid-bg" id="s5">
    <div class="abs cx serif" id="s5-h" style="top:220px; font-size:96px; color:var(--ink); padding:0 60px"></div>
    <div class="abs" id="s5-bar" style="left:70px; top:560px; width:940px; height:124px; border-radius:62px; background:#fff; box-shadow:0 20px 50px -20px rgba(10,30,80,.35), 0 0 0 2px #e3e7ef; display:flex; align-items:center; padding:0 40px; box-sizing:border-box; gap:26px">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#5f6675" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <span style="font-size:40px; color:#1d2230; white-space:nowrap"><span id="s5-q"></span><span id="s5-caret" style="display:inline-block; width:3px; height:46px; background:#0a66e8; vertical-align:-8px; margin-left:3px"></span></span>
    </div>
    <div class="card" id="s5-res" style="left:70px; top:730px; width:940px; height:640px; padding:44px 46px; box-sizing:border-box">
      <div id="s5-r1" style="position:relative; padding:26px 28px; margin:-26px -28px 0; border-radius:26px">
        <div style="display:flex; align-items:center; gap:20px">
          <div style="width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,#4da3ff,#0a66e8); color:#fff; display:grid; place-items:center; font-family:'PF',serif; font-weight:800; font-size:32px">S</div>
          <div><div style="font-size:30px; color:#202124; font-weight:600" id="s5-name"></div><div style="font-size:24px; color:#5f6675" id="s5-url"></div></div>
        </div>
        <div style="font-size:40px; color:#1a3dc0; margin-top:20px; line-height:1.25; font-weight:500" id="s5-title"></div>
        <div style="font-size:28px; color:#4d5260; margin-top:12px; line-height:1.45" id="s5-desc"></div>
        <div class="tap" id="s5-tap" style="left:0; top:0"></div>
      </div>
      <div id="s5-sk1" style="margin-top:56px"><div class="skel" style="width:46%"></div><div class="skel" style="width:78%; height:26px; margin-top:16px"></div><div class="skel" style="width:92%; margin-top:14px"></div></div>
      <div id="s5-sk2" style="margin-top:44px"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%; height:26px; margin-top:16px"></div><div class="skel" style="width:86%; margin-top:14px"></div></div>
    </div>
    <div class="abs cx" id="s5-foot" style="top:1450px">
      <div style="font-size:34px; font-weight:700; letter-spacing:.14em; color:var(--blue)" id="s5-foot1"></div>
      <div class="serif" style="font-size:76px; color:var(--ink); margin-top:18px" id="s5-foot2"></div>
    </div>
  </section>

  <!-- 6. DOMÍNIO E CADEADO -->
  <section class="scene navy-bg" id="s6">
    <div class="abs cx serif" id="s6-h" style="top:220px; font-size:100px; color:#fff; padding:0 60px"></div>
    <div class="abs" id="s6-cam" style="inset:0; transform-origin:150px 678px">
      <div class="browser" style="left:90px; top:600px; width:900px; height:940px; box-shadow:0 60px 120px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.12)">
        <div class="b-bar" style="height:46px"><span class="b-dot" style="background:#ff5f57"></span><span class="b-dot" style="background:#febc2e"></span><span class="b-dot" style="background:#28c840"></span></div>
        <div class="abs" style="left:0; right:0; top:46px; height:64px; background:#eceff4; padding:0 24px; box-sizing:border-box">
          <div style="height:52px; border-radius:26px; background:#fff; display:flex; align-items:center; gap:14px; padding:0 20px; box-shadow:0 0 0 2px rgba(10,102,232,0)" id="s6-url">
            <svg id="s6-lock" width="34" height="34" viewBox="0 0 24 24" style="overflow:visible"><g id="s6-shackle"><path d="M7.5 11V8a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g><rect x="5" y="10.5" width="14" height="10.5" rx="2.2" fill="currentColor"/></svg>
            <span style="font-size:30px; color:#1d2230; white-space:nowrap"><span style="color:#8a90a0" id="s6-https">https://</span><span id="s6-dom"></span><span id="s6-caret" style="display:inline-block; width:3px; height:34px; background:#0a66e8; vertical-align:-6px; margin-left:2px"></span></span>
          </div>
        </div>
        <!-- site de exemplo -->
        <div class="abs" style="left:0; right:0; top:110px; bottom:0; background:#fbf6ee; overflow:hidden">
          <div style="display:flex; align-items:center; gap:16px; padding:28px 40px">
            <i style="width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#e0a052,#b5651d)"></i>
            <b class="serif" style="font-size:30px; color:#2a1d12" id="s6-site-name"></b>
            <span style="flex:1"></span><span class="skel" style="width:80px; background:#eadfce"></span><span class="skel" style="width:80px; background:#eadfce"></span>
            <span style="background:var(--wa); color:#fff; border-radius:999px; padding:12px 22px; font-size:20px; font-weight:700">WhatsApp</span>
          </div>
          <div style="display:flex; gap:34px; padding:40px 40px 0">
            <div style="flex:1.1">
              <div style="font-size:18px; letter-spacing:.2em; color:#b5651d; font-weight:700" id="s6-site-city"></div>
              <div class="serif" style="font-size:64px; color:#2a1d12; margin-top:16px">O seu negócio,<br><span class="it" style="color:#b5651d">na internet.</span></div>
              <div class="skel" style="margin-top:28px; width:92%; background:#eadfce"></div><div class="skel" style="margin-top:14px; width:74%; background:#eadfce"></div>
              <div style="margin-top:34px; display:inline-block; background:var(--wa); color:#fff; border-radius:999px; padding:20px 34px; font-size:26px; font-weight:800">Pedir pelo WhatsApp</div>
            </div>
            <div style="flex:.9; height:430px; border-radius:30px; background:radial-gradient(60% 60% at 40% 35%, #f3c27a, #c96f2a 70%, #8a3f14); box-shadow:inset 0 0 0 10px rgba(255,255,255,.35)"></div>

<script src="textos.js"></script>
<script>
const C = window.TEXTOS;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outQuint = (x) => 1 - Math.pow(1 - x, 5);
const outBack = (x, c = 1.5) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const inOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
// texto com *destaque* em itálico azul; "|" quebra a linha
function rich(s, color = "var(--blue-l)") {
  return s.split("|").map((line) => line.trim().split(" ").map((w) => w).join(" ")).join("<br>")
    .replace(/\*([^*]+)\*/g, `<span class="it" style="color:${color}">$1</span>`);
}
// mesmo texto, palavra por palavra (cada palavra num span .word)
function words(el, s, color = "var(--blue-l)") {
  let html = "", inHi = false;
  s.split("|").forEach((line, li) => {
    if (li) html += "<br>";
    line.trim().split(" ").forEach((w, wi) => {
      const start = w.startsWith("*"), end = w.endsWith("*");
      if (start) inHi = true;
      const clean = w.replace(/\*/g, "");
      html += (wi ? " " : "") + `<span class="word${inHi ? " it" : ""}"${inHi ? ` style="color:${color}"` : ""}>${clean}</span>`;
      if (end) inHi = false;
    });
  });
  el.innerHTML = html;
  return [...el.querySelectorAll(".word")];
}
function enter(el, t, at, dur = 0.5, dy = 50, ease = outCubic) {
  const p = ease(prog(t, at, at + dur));
  el.style.opacity = clamp(prog(t, at, at + dur * 0.7));
  el.style.transform = `translateY(${(1 - p) * dy}px)`;
}
function exitK(t, at, dur = 0.3) { return 1 - prog(t, at, at + dur); }
function wordsIn(ws, t, at, step = 0.09, dur = 0.45, dy = 60) { ws.forEach((w, i) => enter(w, t, at + i * step, dur, dy)); }
function tapAt(el, t, x, y, at) {
  el.style.left = x + "px"; el.style.top = y + "px";
  const a = prog(t, at - 0.25, at - 0.05), press = prog(t, at, at + 0.15), gone = prog(t, at + 0.25, at + 0.45);
  el.style.opacity = clamp(a) * (1 - gone);
  el.style.transform = `scale(${lerp(1.25, 1, a) - 0.18 * Math.sin(Math.PI * press)})`;
}
// revela a cena: círculo, cortina de cima, de baixo, da direita ou fade
function reveal(el, t, a, d, kind, x = 540, y = 960) {
  const p = inOut(prog(t, a, a + d));
  if (kind === "fade") { el.style.opacity = p; el.style.clipPath = "none"; return; }
  el.style.opacity = 1;
  if (p >= 1) { el.style.clipPath = "none"; return; }
  if (kind === "circle") el.style.clipPath = `circle(${p * 2300}px at ${x}px ${y}px)`;
  if (kind === "down") el.style.clipPath = `inset(0 0 ${(1 - p) * 100}% 0)`;
  if (kind === "up") el.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0)`;
  if (kind === "left") el.style.clipPath = `inset(0 0 0 ${(1 - p) * 100}%)`;
}
function show(el, t, a, b) { el.style.visibility = t >= a && t < b ? "visible" : "hidden"; return t >= a && t < b; }
// alimentação da impressora: passos curtos, como papel térmico saindo
function feed(t, t0, step, px, max) {
  if (t < t0) return 0;
  const s = (t - t0) / step, i = Math.floor(s), f = s - i;
  return Math.min(max, (i + outCubic(Math.min(1, f / 0.6))) * px);
}
// gerador pseudoaleatório com semente fixa
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------- MONTAGEM ----------
function printerHTML(id, paperInner) {
  return `<div class="printer" id="${id}">
    <div class="pr-shadow"></div>
    <div class="pr-top"></div>
    <div class="pr-front"><div class="pr-btn"></div><div class="pr-led" id="${id}-led"></div><div class="pr-brand">BN DIGITAL</div><div class="pr-grille"></div></div>
    <div class="pr-paper" id="${id}-paper">${paperInner}<div class="shade"></div><div class="gleam" id="${id}-gleam"></div></div>
    <div class="pr-slot"></div><div class="pr-tear"></div>
  </div>`;
}
function receiptHTML() {
  return `<div class="rc">
    <img class="rc-logo" src="assets/logo-bn-digital.webp">

    { const h = prog(t, 28.75, 29.0); $("s5-r1").style.background = `rgba(10,102,232,${0.07 * h})`; $("s5-r1").style.boxShadow = `0 0 0 ${3 * h}px rgba(10,102,232,${0.55 * h})`;
      tapAt($("s5-tap"), t, 330, 160, 28.95); }
    enter($("s5-foot"), t, 29.2, 0.5, 40);
  }

  // ===== 6. domínio e cadeado =====
  if (show($("s6"), t, ...T.s6)) {
    reveal($("s6"), t, 30.75, 0.5, "circle", 140, 820);
    const z = inOut(prog(t, 32.75, 33.45));
    $("s6-cam").style.transform = `translateY(${(1 - z) * 300}px) scale(${lerp(1.8, 1, z)})`;
    { const q = C.dominio, n = Math.floor(clamp(prog(t, 31.3, 32.3)) * q.length); $("s6-dom").textContent = q.slice(0, n);
      $("s6-caret").style.opacity = t > 31.2 && t < 32.45 ? (Math.floor(t * 4) % 2 ? 1 : 0.15) : 0; }
    { const c = prog(t, 32.4, 32.55), col = c >= 1 ? "#16a34a" : "#8a90a0";
      $("s6-lock").style.color = col; $("s6-shackle").style.transform = `translateY(${(1 - outBack(c, 3)) * -5}px)`;
      $("s6-url").style.boxShadow = `0 0 0 ${c >= 1 ? 3 + 3 * Math.max(0, 1 - prog(t, 32.55, 33.2)) : 0}px rgba(22,163,74,${c >= 1 ? 0.6 : 0})`;
      $("s6-https").style.color = c >= 1 ? "#16a34a" : "#8a90a0"; }
    wordsIn(s6Words, t, 31.05, 0.09, 0.45, 50);
    { const p = prog(t, 33.6, 34.05); $("s6-badge").style.opacity = clamp(p * 2); $("s6-badge").style.transform = `scale(${lerp(0.8, 1, outBack(p, 2))})`; }
  }

  // ===== 7. extras =====
  if (show($("s7"), t, ...T.s7)) {
    reveal($("s7"), t, 35.25, 0.45, "left");
    wordsIn(s7Words, t, 35.5, 0.09, 0.45, 50);
    { const p = prog(t, 35.85, 36.5); $("s7-main").style.opacity = clamp(p * 2);
      $("s7-main").style.transform = `rotateX(${(1 - outBack(p, 1.4)) * 70}deg) translateY(${Math.sin(t * 1.5) * 6}px)`; }
    s7Paths.forEach(({ p, L }, i) => { p.style.strokeDashoffset = L * (1 - inOut(prog(t, 36.35 + i * 0.08, 36.85 + i * 0.08))); });
    s7Cards.forEach((c, i) => { const p = prog(t, 36.75 + i * 0.15, 37.3 + i * 0.15);
      c.style.opacity = clamp(p * 2); c.style.transform = `rotateX(${(1 - outBack(p, 1.6)) * -80}deg) translateY(${Math.sin(t * 1.5 + i) * 5}px)`; });
    enter($("s7-note"), t, 37.55, 0.5, 30);
    const k = exitK(t, 39.6, 0.25); $("s7-h").style.opacity = k; ["s7-main", "s7-note"].forEach((id) => $(id).style.opacity *= k); s7Cards.forEach((c) => c.style.opacity *= k); s7Paths.forEach(({ p }) => p.style.opacity = k);
  }

  // ===== 8. preço =====
  if (show($("s8"), t, ...T.s8)) {
    reveal($("s8"), t, 39.85, 0.4, "down");
    wordsIn(s8Words, t, 40.1, 0.1, 0.45, 50);
    { const p = prog(t, 40.25, 41.0); $("s8-card-w").style.opacity = clamp(p * 2.5);
      $("s8-card-w").style.transform = `translateY(${(1 - outBack(p, 1.2)) * 500}px) rotateX(${(1 - outCubic(p)) * 40}deg) rotateZ(${lerp(-8, -1.5, outCubic(p)) + Math.sin(t * 1.2) * 0.5}deg)`; }
    { const r = inOut(prog(t, 41.0, 41.6)); $("s8-pr").style.clipPath = `inset(0 0 ${(1 - r) * 100}% 0)`; }
    { const p = prog(t, 41.95, 42.12); $("s8-stamp").style.opacity = p > 0 ? 1 : 0;
      $("s8-stamp").style.transform = `rotate(-14deg) scale(${lerp(2.2, 1, outCubic(p))})`;
      const sh = prog(t, 42.12, 42.45); $("s8-shake").style.transform = sh > 0 && sh < 1 ? `translate(${Math.sin(sh * 50) * 10 * (1 - sh)}px, ${Math.cos(sh * 44) * 8 * (1 - sh)}px)` : "none"; }
  }

  // ===== 8b. placa de mesa =====
  if (show($("nf1"), t, ...T.p1)) {
    reveal($("nf1"), t, 44.8, 0.45, "up");
    enter($("p1-eyebrow"), t, 45.0, 0.4, 20); wordsIn(p1Words, t, 45.1, 0.08, 0.45, 50);
    { const p = prog(t, 45.35, 45.95), m = inOut(prog(t, 47.0, 47.6));
      $("p1-plate-w").style.opacity = clamp(p * 2) * lerp(1, 0.55, m);
      $("p1-plate-w").style.transform = `translate(${-m * 150}px, ${(1 - outBack(p, 1.3)) * 90 + m * 40}px) rotateY(${lerp(18, 26, m)}deg) rotateX(${(1 - outCubic(p)) * 30}deg) scale(${lerp(1, 0.86, m)})`; }
    [...$("p1-rings").children].forEach((r, i) => { const st = 46.55 + i * 0.22, c = prog(t, st, st + 0.9);
      r.style.opacity = c > 0 && c < 1 ? (1 - c) * 0.95 : 0; r.style.transform = `scale(${0.6 + c * 2.4})`; });
    { const e = outCubic(prog(t, 45.85, 46.5)), m = inOut(prog(t, 47.0, 47.6)), fl = Math.sin(t * 1.6) * 8 * m;
      const buzz = t > 46.55 && t < 46.8 ? Math.sin(t * 160) * 4 : 0;
      const x = lerp(lerp(1700, 440, e), 325, m) + buzz, y = lerp(lerp(760, 560, e), 520, m) + fl;
      const rz = lerp(lerp(24, -14, e), 0, m), ry = lerp(lerp(-30, -12, e), 0, m);
      $("ph2").style.transform = `translate(${x}px, ${y}px) rotateY(${ry}deg) rotateZ(${rz}deg)`;
      $("ph2").style.boxShadow = `0 0 0 2px rgba(255,255,255,.18) inset, 0 2px 0 3px #2a2d35, 0 60px 100px -30px rgba(0,0,0,.8)`; }
    { const s1 = outCubic(prog(t, 46.7, 47.1)); $("mn").style.transform = `translateY(${(1 - s1) * 100}%)`;
      $("mn-in").style.transform = `translateY(${-lerp(0, 250, inOut(prog(t, 48.0, 50.6)))}px)`; }
    { const p = prog(t, 47.6, 48.1); $("p1-cap").style.opacity = p; $("p1-cap").style.transform = `translateY(${(1 - outCubic(p)) * 40}px)`; }
    enter($("p1-sub"), t, 47.95, 0.45, 24);
  }

  // ===== 8c. tipos de placa =====
  if (show($("nf2"), t, ...T.p2)) {
    reveal($("nf2"), t, 50.95, 0.45, "left");
    wordsIn(p2Words, t, 51.15, 0.08, 0.45, 50);
    { const p = prog(t, 51.35, 51.9); $("p2-photo").style.opacity = clamp(p * 2); $("p2-photo").style.transform = `translateY(${(1 - outCubic(p)) * 60}px)`;
      $("p2-img").style.transform = `scale(${lerp(1.12, 1.0, outCubic(prog(t, 51.35, 56.7)))})`; }
    pills.forEach((el, i) => { const p = prog(t, 51.95 + i * 0.13, 52.4 + i * 0.13);
      el.style.opacity = clamp(p * 2); el.style.transform = `scale(${p > 0 ? outBack(p, 2) : 0.6}) translateY(${Math.sin(t * 1.4 + i) * 3}px)`; });
    enter($("p2-foot"), t, 53.15, 0.5, 40);
  }

  // ===== 9. chamada final =====
  if (show($("s9"), t, T.s9[0], T.s9[1] + 1)) {
    const u = t - D9;
    reveal($("s9"), u, 44.75, 0.55, "circle", 760, 640);
    { const p = prog(u, 45.0, 45.55); $("s9-logo").style.opacity = clamp(p * 2); $("s9-logo").style.transform = `scale(${lerp(0.7, 1, outBack(p))})`; }
    enter($("s9-pre"), u, 45.25, 0.5, 30);
    wordsIn(s9Words, u, 45.8, 0.08, 0.45, 50);
    { const p = prog(u, 46.5, 47.0); $("s9-btn-w").style.opacity = clamp(p * 1.6); $("s9-btn-w").style.transform = `scale(${lerp(0.85, 1, outBack(p, 2))})`;
      const pr = Math.sin(Math.PI * prog(u, 47.75, 47.9)); $("s9-btn").style.transform = `scale(${1 - 0.05 * pr + (u > 48 ? 0.025 * Math.sin((u - 48) * 5) : 0)})`;
      $("s9-shine").style.left = `${lerp(-200, 900, prog(u, 47.1, 47.6))}px`; }
    tapAt($("s9-tap"), u, 540, 92, 47.75);
    enter($("s9-num"), u, 46.85, 0.45, 26); enter($("s9-ig"), u, 47.0, 0.45, 26); enter($("s9-city"), u, 47.15, 0.45, 26);
  }
};

window.ready = (async () => {
  for (const f of ['800 100px "PF"', 'italic 800 100px "PF"', '600 40px "IN"', '800 40px "MO"', '400 40px "MO"']) await document.fonts.load(f);
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  window.render(0);
  return true;
})();
</script>
