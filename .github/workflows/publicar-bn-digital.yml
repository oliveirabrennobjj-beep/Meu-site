# Publica no GitHub Pages:
#   BN Digital (bn-digital/dist) → https://oliveirabrennobjj-beep.github.io/Meu-site/
#   BR Team    (brteam/dist)     → https://oliveirabrennobjj-beep.github.io/Meu-site/brteam/
#   Açaí do Rei (acai-do-rei)    → https://oliveirabrennobjj-beep.github.io/Meu-site/acai-do-rei/
#   Raio-X     (raiox-das-coisas) → https://oliveirabrennobjj-beep.github.io/Meu-site/raiox/
#   Construtora (construtora)     → https://oliveirabrennobjj-beep.github.io/Meu-site/construtora/
#   Prospecção (bn-digital/prospeccao/index.html) → https://oliveirabrennobjj-beep.github.io/Meu-site/prospeccao/
# Requer, uma vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar sites (BN Digital, BR Team e Raio-X)

on:
  push:
    branches: [main]
    paths:
      - "bn-digital/dist/**"
      - "brteam/dist/**"
      - "acai-do-rei/**"
      - "raiox-das-coisas/**"
      - "construtora/**"
      - "bn-digital/prospeccao/index.html"
      - ".github/workflows/publicar-bn-digital.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Junta os sites
        run: |
          mkdir -p _site
          cp -r bn-digital/dist/. _site/
          mkdir -p _site/brteam
          cp -r brteam/dist/. _site/brteam/
          mkdir -p _site/acai-do-rei
          cp -r acai-do-rei/. _site/acai-do-rei/
          mkdir -p _site/raiox
          cp -r raiox-das-coisas/. _site/raiox/
          rm -f _site/raiox/README.md
          mkdir -p _site/construtora
          cp -r construtora/. _site/construtora/
          rm -f _site/construtora/README.md _site/construtora/assets/video/LEIA.md
          mkdir -p _site/prospeccao
          cp bn-digital/prospeccao/index.html _site/prospeccao/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
